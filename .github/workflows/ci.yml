name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy types-PyYAML
        pip install -r requirements-minimal.txt
    
    - name: Check code formatting with Black
      run: black --check --diff ai_safety_guardrails/
    
    - name: Check import sorting with isort
      run: isort --check-only --diff ai_safety_guardrails/
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 ai_safety_guardrails/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 ai_safety_guardrails/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type checking with mypy
      run: mypy ai_safety_guardrails/ --ignore-missing-imports || echo "mypy issues detected but not blocking CI"

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Set UTF-8 encoding on Windows
      if: runner.os == 'Windows'
      run: |
        chcp 65001
        echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV
      shell: cmd
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-cov
        pip install -r requirements-minimal.txt
        pip install spacy
    
    - name: Install spaCy model
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "Skipping spaCy model download on Windows"
        else
          python -m spacy download en_core_web_sm || echo "spaCy model download failed, continuing..."
        fi
      shell: bash
    
    - name: Install package in development mode
      run: pip install -e .
    
    - name: Run minimal tests
      run: python test_package_minimal.py
    
    - name: Test CLI commands
      run: |
        ai-safety --version
        ai-safety --help
        ai-safety test --detectors spam --text "Test message"
        ai-safety create list-templates
        ai-safety models list
    
    - name: Run pytest (if tests directory exists)
      run: |
        if [ -d "tests" ]; then
          pytest tests/ -v --cov=ai_safety_guardrails --cov-report=xml
        else
          echo "No tests directory found, skipping pytest"
        fi
      shell: bash
    
    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep
        pip install -r requirements-minimal.txt
    
    - name: Run safety check
      run: safety check
    
    - name: Run bandit security scan
      run: bandit -r ai_safety_guardrails/ -f json -o bandit-report.json || true
    
    - name: Upload bandit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-results
        path: bandit-report.json

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-minimal.txt
        pip install markdown
    
    - name: Check README rendering
      run: |
        python -c "import markdown; print('README.md renders correctly')"
    
    - name: Validate package metadata
      run: |
        pip install twine
        python setup.py sdist
        twine check dist/*

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install full dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install transformers sentence-transformers
        pip install -r requirements-minimal.txt
        pip install spacy
    
    - name: Install spaCy model
      run: python -m spacy download en_core_web_sm || echo "spaCy model download failed, continuing..."
    
    - name: Install package
      run: pip install -e .
    
    - name: Run integration tests
      run: |
        # Test with actual ML models (takes longer but more comprehensive)
        python examples/basic_usage.py
    
    - name: Test template generation
      run: |
        ai-safety create app test-chat-app --template chat --llm openai --output /tmp/test-app
        ls -la /tmp/test-app/
        cat /tmp/test-app/test-chat-app/README.md