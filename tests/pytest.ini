[tool:pytest]
# Pytest configuration for AI Safety Guardrails tests

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    e2e: End-to-end tests (complete workflows)
    slow: Slow tests (performance, stress tests)
    requires_models: Tests that require ML models to be downloaded
    requires_api_keys: Tests that require API keys for external services

# Async configuration
asyncio_mode = auto

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --cov=ai_safety_guardrails
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning:transformers.*
    ignore::UserWarning:torch.*
    ignore::FutureWarning:transformers.*

# Test execution order
# Run unit tests first, then integration, then e2e
pytest_collection_modifyitems_hooks = 
    tests.conftest:pytest_collection_modifyitems